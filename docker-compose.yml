# ForgeOps — production stack
# Usage: docker compose up -d --build
#
# The app runs with SQLite by default (volume-mounted). To use Postgres,
# uncomment the db service and set DATABASE_URL accordingly (see DEPLOYMENT.md).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeops:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-file:/data/forgeops.db}
      # OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - forgeops-data:/data
    depends_on:
      - db
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ── Optional Postgres ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forgeops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Expose only when needed locally:
    # ports:
    #   - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-forgeops} -d ${POSTGRES_DB:-forgeops}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  forgeops-data:
  postgres-data:
