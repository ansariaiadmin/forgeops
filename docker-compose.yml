# ForgeOps — production stack (PostgreSQL + Prisma + Next.js)
# Usage: docker compose up -d --build
#
# ENV required (see .env.example or DEPLOYMENT.md):
#   NEXTAUTH_SECRET — random 32+ bytes (openssl rand -base64 32)
#   ENCRYPTION_KEY — 64 hex chars (32 bytes) for AES-256-GCM
#   POSTGRES_PASSWORD — strong password for Postgres
#   DATABASE_URL — e.g. postgresql://forgeops:${POSTGRES_PASSWORD}@db:5432/forgeops?schema=public
#   NEXTAUTH_URL — public URL (http://localhost:3000 for local)
#   POSTGRES_USER / POSTGRES_DB — optional, defaults to forgeops
#
# For SQLite dev: DATABASE_URL=file:/data/forgeops.db (default if not set)
# For Postgres prod: set DATABASE_URL to postgresql://... and ensure schema is Postgres

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: forgeops:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-forgeops}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-forgeops}?schema=public}
      POSTGRES_USER: ${POSTGRES_USER:-forgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forgeops}
    volumes:
      - forgeops-data:/data
      - ./prisma:/app/prisma:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/api/health/live']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - forgeops-net
    labels:
      - 'com.forgeops.description=ForgeOps Next.js app with Prisma'

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forgeops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-forgeops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-forgeops} -d ${POSTGRES_DB:-forgeops}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - forgeops-net
    labels:
      - 'com.forgeops.description=PostgreSQL 16 for ForgeOps'

volumes:
  forgeops-data:
    driver: local
  postgres-data:
    driver: local

networks:
  forgeops-net:
    driver: bridge
